<!DOCTYPE html>
<html lang="de" id="htmlRoot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standheizung Tracker</title>
<style>
:root{
  color-scheme: light;
  --bg:#f4f3f0; --surface:#fcfcfb; --surface-2:#efeeea; --line:#e2e0da;
  --text:#0b0b0b; --text-2:#52514e; --muted:#85837d;
  --accent:#eb6834; --accent-ink:#b9461a; --accent-soft:#fbe4d9;
  --blue:#2a78d6; --good:#008300; --warn:#b47a00; --danger:#c8332f;
  --grid:#e7e5df; --radius:16px;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#252523; --line:#30302d;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8d8c85;
    --accent:#d95926; --accent-ink:#f2925f; --accent-soft:#3a2219;
    --blue:#3987e5; --good:#0ca30c; --warn:#e0a52a; --danger:#e66767; --grid:#2c2c29;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding:16px 16px 96px;min-height:100vh}
header.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 16px}
header.top h1{font-size:20px;margin:0;letter-spacing:-.01em}
header.top .sub{font-size:13px;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.warn{background:#eda100}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card h2{font-size:13px;font-weight:600;color:var(--text-2);margin:0 0 12px;text-transform:uppercase;letter-spacing:.04em}

/* Hero */
.hero .big{font-size:40px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.hero .big small{font-size:16px;font-weight:500;color:var(--text-2);margin-left:4px}
.hero .lbl{font-size:13px;color:var(--text-2)}
.hero .row{display:flex;gap:16px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.hero .row > div{flex:1}
.hero .row .v{font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}
.hero .row .l{font-size:12px;color:var(--text-2)}
.tank{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.tank .bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:8px 0 6px}
.tank .bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.tank .bar i.low{background:var(--danger)}
.tank .t{display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums}
.tank .t b{color:var(--text)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--surface-2);border-radius:12px;padding:12px}
.kpi .l{font-size:12px;color:var(--text-2)}
.kpi .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.01em}
.kpi .v small{font-size:13px;font-weight:500;color:var(--text-2);margin-left:3px}
.kpi .h{font-size:11px;color:var(--muted);margin-top:2px}

.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 6px;font-size:13px;cursor:pointer;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* List */
.entry{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.entry:first-child{border-top:0}
.ico{flex:0 0 36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--accent-soft)}
.entry .main{flex:1;min-width:0}
.entry .t{font-weight:600}
.entry .s{font-size:13px;color:var(--text-2)}
.entry .x{font-size:12px;color:var(--accent-ink);margin-top:2px;font-variant-numeric:tabular-nums}
.entry .r{text-align:right;font-variant-numeric:tabular-nums}
.fdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin:-4px 0 10px}
.seasonsel{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);margin:-4px 0 12px;font-weight:600}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--text-2);margin-left:6px;font-weight:500;vertical-align:1px}
.month-h{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 2px 4px}
.empty{text-align:center;color:var(--muted);padding:28px 8px}

/* Charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .axis{fill:var(--muted);font-size:11px}
.chart .gridl{stroke:var(--grid);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .1s;font-variant-numeric:tabular-nums;z-index:2}
.tip.on{opacity:1}
.chart-total{font-size:13px;color:var(--text-2);margin:-6px 0 10px}

/* Tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 14px;font-size:11px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button .i{font-size:19px;line-height:1;filter:grayscale(1);opacity:.7}
nav.tabs button.on{color:var(--text);font-weight:600}
nav.tabs button.on .i{filter:none;opacity:1}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:78px;height:56px;padding:0 22px 0 18px;border-radius:999px;border:0;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:6;display:flex;align-items:center;gap:8px}
.fab span{font-size:26px;line-height:1;margin-top:-2px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.overlay.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px 24px;max-height:92vh;overflow:auto}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0 0 14px;font-size:18px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:4px}
.field input,.field select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);outline:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2);margin-bottom:12px;cursor:pointer;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.check .h{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;flex:1}
.btn.danger{color:var(--danger)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
.notice{font-size:13px;color:var(--text-2);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.hidden{display:none!important}
textarea.csv{width:100%;height:120px;font-family:ui-monospace,monospace;font-size:11px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding:8px}
table.cmp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
table.cmp th{font-size:12px;color:var(--text-2);font-weight:500;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.cmp th:first-child,table.cmp td:first-child{text-align:left}
table.cmp td{text-align:right;padding:9px 4px;border-bottom:1px solid var(--line)}
table.cmp tr:last-child td{border-bottom:0}
/* Header-Umschalter */
.hsw{border:0;background:none;padding:0;text-align:left;cursor:pointer;display:block}
.hsw h1 .car{font-size:13px;color:var(--muted);margin-left:6px;vertical-align:2px}
.hlist .hrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.hlist .hrow.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.hlist .hrow .hi{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:18px}
.hlist .hrow.on .hi{background:var(--accent);color:#fff}
.hlist .hrow .hn{font-weight:600}
.hlist .hrow .hs{font-size:12px;color:var(--text-2)}
.hlist .hrow .ck{margin-left:auto;color:var(--accent-ink);font-weight:700}
/* Prognose */
.fc{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.fc .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.fc .lbl{font-size:13px;color:var(--text-2)}
.fc .lbl{min-width:0}
.fc .val{white-space:nowrap;font-size:24px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.fc .bar{position:relative;height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:10px 0 6px}
.fc .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent)}
.fc .bar b{position:absolute;top:0;bottom:0;border-radius:999px;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--accent) 45%,transparent) 0 4px,transparent 4px 8px)}
.fc .t{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.fc .q{font-size:11px;color:var(--muted);margin-top:6px}
/* Erinnerungen */
.nrow{display:flex;align-items:center;gap:14px}
.nrow .nbell{flex:0 0 44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--surface-2);transition:background .2s}
.nrow .nbell.on{background:var(--accent-soft);animation:ring .9s ease-in-out 1}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
.nrow .nt{font-weight:600;font-size:16px}
.nrow .ns{font-size:12px;color:var(--text-2)}
.switch{position:relative;margin-left:auto;flex:0 0 52px;height:32px;cursor:pointer}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.switch.sm{flex-basis:44px;height:26px}
.switch.sm span::after{width:20px;height:20px}
.switch.sm input:checked+span::after{transform:translateX(18px)}
.nbody{margin-top:16px;padding-top:4px;transition:opacity .2s}
.nbody.off{opacity:.4;pointer-events:none}
.nlabel{font-size:12px;color:var(--text-2);margin:12px 0 8px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 13px;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.pill.on{background:var(--text);border-color:var(--text);color:var(--surface);font-weight:600}
.npreview{margin-top:16px;border-radius:14px;padding:12px 14px;background:var(--surface-2);display:flex;gap:12px;align-items:flex-start}
.npreview .ni{flex:0 0 32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px}
.npreview .nh{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.npreview .nm{font-size:14px;font-weight:600;margin-top:1px}
.npreview .nx{font-size:13px;color:var(--text-2)}
.hrem{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.hrem:first-child{border-top:0}
.nwarn{margin-top:12px;border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--text);font-size:13px}
.nwarn button{margin-top:8px}
.linkbtn{border:0;background:none;color:var(--accent-ink);font-weight:600;padding:0;cursor:pointer;font-size:13px}
/* Wetter */
.wx .whead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wx .wsum{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wx .wsum small{font-size:14px;font-weight:500;color:var(--text-2);margin-left:4px}
.wx .wplace{font-size:12px;color:var(--text-2);text-align:right}
.wx .wlearn{font-size:12px;color:var(--text-2);margin-top:8px}
.wx .wattr{font-size:11px;color:var(--muted);margin-top:6px}
.wx .wattr a{color:inherit}
.pausebtn{margin-top:14px;width:100%;border:1px dashed var(--line);background:var(--surface-2);border-radius:12px;padding:10px;font-weight:600;cursor:pointer;color:var(--text-2)}
.pausebtn.on{border-style:solid;border-color:color-mix(in srgb,var(--blue) 50%,transparent);background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--text)}
.pausetag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--text);margin-left:8px;vertical-align:3px}
.locseg{display:flex;gap:6px;flex-wrap:wrap}
.locres{margin-top:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.locres button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:var(--surface);padding:10px 12px;cursor:pointer}
.locres button:first-child{border-top:0}
.locres small{color:var(--text-2);display:block;font-size:12px}
.optrow{display:flex;align-items:center;gap:12px}
.optrow .ot{font-weight:600}
.optrow .os{font-size:12px;color:var(--text-2)}
/* Update */
.upd{display:flex;gap:12px;align-items:center;background:var(--text);color:var(--surface);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.upd .ui{flex:0 0 36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-size:18px;color:#fff}
.upd .ut{font-weight:600;font-size:14px}
.upd .us{font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upd .ub{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.upd button{border:0;border-radius:10px;padding:9px 12px;font-weight:600;cursor:pointer;font-size:13px}
.upd .go{background:var(--accent);color:#fff}
.upd .later{background:transparent;color:var(--surface);opacity:.7;padding:9px 6px}
.upd .pb{height:4px;border-radius:999px;background:rgba(255,255,255,.2);margin-top:6px;overflow:hidden}
.upd .pb i{display:block;height:100%;background:var(--accent);transition:width .2s}
.ver{display:flex;align-items:center;gap:12px}
.ver .vn{font-weight:600}
.ver .vs{font-size:12px;color:var(--text-2)}
.ver .btn{margin-left:auto}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="hsw" id="hsw" data-i18n-aria="hsw.aria">
      <h1><span id="title"></span><span class="car">▼</span></h1>
      <div class="sub" id="subtitle"></div>
    </button>
    <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTxt" data-i18n="sync.loading"></span></div>
  </header>

  <div id="notice" class="notice hidden"></div>
  <div id="updBanner" class="upd hidden"></div>

  <!-- ÜBERSICHT -->
  <section id="v-home">
    <div class="card hero" id="hero"></div>
    <div class="card wx hidden" id="wxCard"></div>
    <div class="card">
      <h2 id="seasonLabel" data-i18n="home.season"></h2>
      <div class="kpis" id="kpiSeason"></div>
      <div id="forecast"></div>
    </div>
    <div class="card">
      <h2 data-i18n="home.recent"></h2>
      <div id="recent"></div>
    </div>
  </section>

  <!-- VERLAUF -->
  <section id="v-list" class="hidden">
    <div class="card" style="padding-top:4px" id="fullList"></div>
  </section>

  <!-- STATISTIK -->
  <section id="v-stats" class="hidden">
    <div class="seg" id="period">
      <button data-p="season" class="on" data-i18n="per.season"></button>
      <button data-p="year" data-i18n="per.year"></button>
      <button data-p="12m" data-i18n="per.12m"></button>
      <button data-p="all" data-i18n="per.all"></button>
    </div>
    <select id="seasonSel" class="seasonsel" data-i18n-aria="season.aria"></select>
    <div class="card">
      <h2 id="periodLabel" data-i18n="stats.period"></h2>
      <div class="kpis" id="kpiStats"></div>
    </div>
    <div class="card">
      <h2 data-i18n="stats.rate"></h2>
      <div class="chart-total" id="cRateT"></div>
      <div class="chart" id="cRate"></div>
    </div>
    <div class="card">
      <h2 data-i18n="stats.cost"></h2>
      <div class="chart-total" id="cCostT"></div>
      <div class="chart" id="cCost"></div>
    </div>
    <div class="card">
      <h2 data-i18n="stats.price"></h2>
      <div class="chart-total" id="cPriceT"></div>
      <div class="chart" id="cPrice"></div>
    </div>
    <div class="card" id="fuelCard">
      <h2 data-i18n="stats.byFuel"></h2>
      <div id="fuelTable"></div>
    </div>
    <div class="card" id="seasonCard">
      <h2 data-i18n="stats.years"></h2>
      <div id="seasonTable"></div>
    </div>
  </section>

  <!-- EINSTELLUNGEN -->
  <section id="v-settings" class="hidden">
    <div class="card" id="heaterCard">
      <h2 id="sHeaterH" data-i18n="set.heater"></h2>
      <div class="field"><label data-i18n="set.name"></label><input id="sName" data-i18n-ph="set.name.ph"></div>
      <div class="field"><label data-i18n="set.model"></label><input id="sModel" data-i18n-ph="set.model.ph"></div>
      <div class="row2">
        <div class="field"><label data-i18n="set.fuel"></label>
          <select id="sFuel"></select></div>
        <div class="field"><label data-i18n="set.tank"></label><input id="sTank" type="number" step="0.5" min="0" inputmode="decimal" data-i18n-ph="optional"></div>
      </div>
      <div class="hint" data-i18n="set.tankHint"></div>
      <div id="locWrap" class="hidden" style="margin-top:14px">
        <div class="nlabel" style="margin-top:0" data-i18n="loc.title"></div>
        <div class="locseg pills"><button class="pill" data-lm="phone" data-i18n="loc.phone"></button><button class="pill" data-lm="fixed" data-i18n="loc.fixed"></button></div>
        <div id="locFixed" class="hidden" style="margin-top:10px">
          <div class="row2" style="grid-template-columns:1fr auto"><input id="locQ" class="seasonsel" style="margin:0;font-weight:400" data-i18n-ph="loc.search.ph"><button class="btn" id="locGo" data-i18n="loc.search"></button></div>
          <div class="locres hidden" id="locRes"></div>
        </div>
        <div class="hint" id="locInfo" style="margin-top:6px"></div>
      </div>

<script src="i18n.js"></script>

<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const DEFAULT_SETTINGS = { yearStart:8, notify:{on:false, days:3, hour:18}, widget:null, lang:"auto", weather:{on:false}, pauseFeature:false };
const t=I18N.t, tn=I18N.tn;
const cleanLoc=(l)=>{ l=l||{}; const fx=l.mode==="fixed"&&isFinite(l.lat)&&isFinite(l.lon); return fx? {mode:"fixed",lat:+(+l.lat).toFixed(2),lon:+(+l.lon).toFixed(2),name:String(l.name||"").slice(0,80)} : {mode:l.mode==="fixed"?"fixed":"phone"}; };
const cleanPauses=(p)=>Array.isArray(p)? p.filter(x=>x&&Number.isInteger(x.from)).map(x=>({from:x.from,to:Number.isInteger(x.to)?x.to:null})).slice(-200) : [];
const newHeater=(o={})=>({ id:o.id||("h"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)), name:String(o.name||"").slice(0,60), model:String(o.model||"").slice(0,80), fuel:o.fuel||"Diesel", tank:o.tank??null, notify:o.notify!==false,
  loc:cleanLoc(o.loc), wxSince:Number.isInteger(o.wxSince)?o.wxSince:null, pauses:cleanPauses(o.pauses) });
const FUELS=[["Diesel","#2a78d6","#3987e5"],["Heizöl","#eb6834","#d95926"],["HVO100","#1baf7a","#199e70"],["Petroleum","#eda100","#c98500"],["Benzin","#e87ba4","#d55181"],["Sonstiges","#008300","#0ca30c"]];
const FUEL_NAMES=FUELS.map(f=>f[0]);
const darkMQ=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
const fuelColor=(name)=>{ const f=FUELS.find(x=>x[0]===name)||FUELS[FUELS.length-1]; return darkMQ&&darkMQ.matches?f[2]:f[1]; };
const state = { settings:structuredClone(DEFAULT_SETTINGS), heaters:[newHeater({id:"h1"})], active:"h1", fills:[], locs:[], view:"home", period:"season", seasonY:null };
const SM=()=>{ const m=+state.settings.yearStart; return m>=0&&m<12?m:8; };
const hjOf=(d)=> d.getMonth()>=SM()? d.getFullYear() : d.getFullYear()-1;
const curSeason=()=>hjOf(new Date());
const hjRange=(y)=>[new Date(y,SM(),1), new Date(y+1,SM(),1)];
const hjSpan=()=> `${MONTHS[SM()]} – ${MONTHS[(SM()+11)%12]}`;
const H=()=> state.heaters.find(h=>h.id===state.active) || state.heaters[0];
const hid=(f)=> f.heaterId || state.heaters[0].id;
const fuelOf=(f)=> FUEL_NAMES.includes(f.fuel)? f.fuel : (FUEL_NAMES.includes(H().fuel)? H().fuel : "Diesel");
const DAY=86400000;

/* ---------- Format ---------- */
const nf=(d)=>new Intl.NumberFormat(I18N.locale(),{minimumFractionDigits:d,maximumFractionDigits:d});
let n0,n1,n2,n3,cur2,cur0,dFmt,dmFmt,wdFmt,MONTHS,MONTHS_L;
function setupLocale(){
  n0=nf(0); n1=nf(1); n2=nf(2); n3=nf(3);
  cur2=new Intl.NumberFormat(I18N.locale(),{style:"currency",currency:"EUR"});
  cur0=new Intl.NumberFormat(I18N.locale(),{style:"currency",currency:"EUR",minimumFractionDigits:0,maximumFractionDigits:0});
  dFmt=new Intl.DateTimeFormat(I18N.locale(),{day:"2-digit",month:"2-digit",year:"numeric"});
  dmFmt=new Intl.DateTimeFormat(I18N.locale(),I18N.getLang()==="de"?{day:"2-digit",month:"2-digit"}:{day:"numeric",month:"short"});
  wdFmt=new Intl.DateTimeFormat(I18N.locale(),{weekday:"short",day:"2-digit",month:"2-digit"});
  MONTHS=I18N.months(); MONTHS_L=I18N.monthsLong();
}
const eur=(v)=>cur2.format(v||0);
const eur0=(v)=>cur0.format(v||0);
const UL=()=>t("u.l");
const fuelName=(f)=>t("fuel."+f);
/* Sprache wählen und alle festen Texte der Seite setzen */
function applyLang(){
  I18N.setLang(I18N.detect(state.settings.lang, navigator.language));
  document.documentElement.lang=I18N.getLang();
  setupLocale();
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent=t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{ el.innerHTML=t(el.dataset.i18nHtml); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{ el.placeholder=t(el.dataset.i18nPh); });
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>{ el.setAttribute("aria-label",t(el.dataset.i18nAria)); });
  document.querySelectorAll("#nDays .pill").forEach(b=>{ const d=+b.dataset.d; if(d!==7) b.textContent=tn("days",d,n0.format(d)); });
  document.querySelectorAll("#langPills .pill").forEach(b=>b.classList.toggle("on",b.dataset.l===(state.settings.lang||"auto")));
  const fuelOpts=FUEL_NAMES.map(n=>`<option value="${n}">${fuelName(n)}</option>`).join("");
  const sv=$("sFuel").value, fv=$("fFuel").value;
  $("sFuel").innerHTML=fuelOpts; $("fFuel").innerHTML=fuelOpts;
  if(sv) $("sFuel").value=sv; if(fv) $("fFuel").value=fv;
  $("sYearStart").innerHTML=MONTHS_L.map((m,i)=>`<option value="${i}">${m}${i===8?t("hj.recommended"):i===0?t("hj.calendar"):""}</option>`).join("");
  appliedLang=I18N.getLang()+"|"+(state.settings.lang||"auto");
}
let appliedLang="";
const pad=(x)=>String(x).padStart(2,"0");
const toInput=(d)=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=(s)=>{ const [y,m,d]=String(s).slice(0,10).split("-").map(Number); return new Date(y,m-1,d); };
const fmtDate=(s)=>dFmt.format(parseD(s));
const days=(a,b)=>Math.round((b-a)/DAY);
const num=(v)=>{ if(v===""||v==null) return null; const x=parseFloat(String(v).replace(",",".")); return isFinite(x)?x:null; };
const esc=(s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());};
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),1800);}
const n_=(n)=>n0.format(n);
const daysTxt=(n)=>tn("days",n,n_(n));

/* ---------- Kern-Berechnung ----------
   Intervalle zwischen zwei Vollbetankungen: Liter = Summe aller Füllungen nach der vorigen
   Vollbetankung bis einschließlich der aktuellen; Zeitraum = Tage zwischen beiden. */
function heaterFills(h){ const id=(h||H()).id; return state.fills.filter(f=>hid(f)===id); }
function sortedAsc(h){ return heaterFills(h).sort((a,b)=>parseD(a.date)-parseD(b.date) || (a.created||0)-(b.created||0)); }
function intervals(h){ h=h||H(); return Calc.intervals(heaterFills(h), num(h.tank)||0); }
// Verbrauch/Kosten anteilig auf einen Zeitraum [a,b) verteilen (ganze Tage, zeitumstellungsfest)
const share=(ivs,a,b)=>Calc.share(ivs,a,b);
const seasonName=(y)=> SM()===0 ? `${y}` : `${y}/${String(y+1).slice(2)}`;
function periodRange(p, sy){
  const now=today();
  if(p==="year") return [new Date(now.getFullYear(),0,1), null, t("per.yearN",{y:now.getFullYear()})];
  if(p==="12m") return [new Date(now.getFullYear()-1,now.getMonth(),now.getDate()), null, t("per.last12")];
  if(p==="season"){ const y=sy??curSeason(); const [a,b]=hjRange(y); return [a, b, t("per.hj",{y:seasonName(y)})]; }
  return [null,null,t("per.allTime")];
}
function periodStats(range){
  const [a,b]=range; const ivs=intervals(); const sh=share(ivs,a,b);
  const fills=heaterFills().filter(f=>{const d=parseD(f.date);return (!a||d>=a)&&(!b||d<b);});
  const bought=fills.reduce((s,f)=>s+(f.total||0),0), boughtL=fills.reduce((s,f)=>s+(f.liters||0),0);
  return {...sh, rate: sh.days? sh.liters/sh.days:0, costDay: sh.days? sh.cost/sh.days:0,
    fills:fills.length, bought, boughtL, avgPrice: boughtL? bought/boughtL:0};
}

/* ---------- Speicher ---------- */
const LS_KEY="standheizung-tank-v2";
// Ältere Datenstände (eine Heizung, Einstellungen am Profil) in das neue Format übernehmen
function adoptProfile(d){
  d=d||{}; const s=d.settings||{};
  let heaters=Array.isArray(d.heaters)&&d.heaters.length ? d.heaters.map(newHeater) : [newHeater({id:"h1", name:s.name, model:s.model, fuel:s.fuel, tank:s.tank})];
  state.heaters=heaters;
  state.active = heaters.some(h=>h.id===d.active) ? d.active : heaters[0].id;
  const n=s.notify||{};
  state.settings={ yearStart: Number.isInteger(s.yearStart)?s.yearStart:8,
    notify:{ on:!!n.on, days:[1,2,3,5,7].includes(n.days)?n.days:3, hour:[8,12,18,20].includes(n.hour)?n.hour:18 },
    widget: heaters.some(h=>h.id===s.widget)? s.widget : null,
    lang: ["de","en"].includes(s.lang)? s.lang : "auto",
    weather:{ on: !!(s.weather&&s.weather.on) }, pauseFeature: !!s.pauseFeature };
  state.locs = Array.isArray(d.locs)? d.locs.filter(x=>x&&Number.isInteger(x.d)&&isFinite(x.lat)&&isFinite(x.lon)).slice(-800) : [];
}
const profileBody=()=>({settings:structuredClone(state.settings), heaters:state.heaters.map(h=>structuredClone(h)), active:state.active, locs:state.locs.slice()});
let backend="local", profileRef=null, fillsCol=null;
function lsRead(){ try{ return JSON.parse(localStorage.getItem(LS_KEY))||null; }catch(e){ return null; } }
function lsWrite(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({...profileBody(),fills:state.fills})); }catch(e){} }
function setSync(kind,txt){ $("syncDot").className="dot "+(kind||""); $("syncTxt").textContent=txt; }
function showNotice(txt){ const n=$("notice"); if(!txt){n.classList.add("hidden");return;} n.textContent=txt; n.classList.remove("hidden"); }
function useLocal(reason){
  backend="local"; const d=lsRead();
  if(window.AndroidBridge){ $("syncDot").parentNode.classList.add("hidden"); reason=null; }
  if(d){ adoptProfile(d); state.fills=d.fills||[]; }
  setSync("warn",t("sync.local")); if(reason) showNotice(reason); render();
}
async function init(){
  render();
  if(!window.claude || typeof window.claude.use!=="function"){ useLocal(); return; }
  let settled=false;
  const timer=setTimeout(()=>{ if(!settled){ settled=true; useLocal(t("sync.cloudDown")); } },10000);
  try{
    const [db,user]=await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const uid = user ? await user.id() : null;
    if(settled) return;
    if(!db || !uid){ settled=true; clearTimeout(timer); useLocal(); return; }
    backend="db";
    profileRef=db.doc(`data/users/${uid}/tank`);
    fillsCol=profileRef.collection("fills");
    let gotP=false, gotF=false;
    const done=()=>{ if(gotP&&gotF&&!settled){ settled=true; clearTimeout(timer); setSync("ok",t("sync.ok")); showNotice(""); } };
    const onErr=(e)=>{ if(!settled){ settled=true; clearTimeout(timer); } setSync("warn",t("sync.err")); showNotice(t("sync.interrupted",{code:(e&&e.code)||t("err")})); };
    profileRef.onSnapshot(s=>{ const d=s.exists?s.data():{}; adoptProfile(d); if(!s.metadata.fromCache) gotP=true; done(); render(); },onErr);
    fillsCol.onSnapshot(q=>{ state.fills=q.docs.map(d=>({...d.data(),id:d.id})); if(!q.metadata.fromCache) gotF=true; done(); render(); },onErr);
  }catch(e){ if(!settled){ settled=true; clearTimeout(timer); useLocal(); } }
}
function writeErr(err){ toast(err&&err.code==="quota_exceeded" ? t("toast.full") : t("toast.saveFail")); }
let pBusy=Promise.resolve();
function saveSettings(){
  if(backend!=="db"){ lsWrite(); render(); return; }
  const body=profileBody();
  pBusy=pBusy.then(()=>profileRef.set(body)).catch(writeErr); render();
}
async function saveFill(f){
  const body={...f}; const id=body.id; delete body.id;
  if(backend!=="db"){
    if(id){ const i=state.fills.findIndex(x=>x.id===id); if(i>=0) state.fills[i]={...body,id}; }
    else state.fills.push({...body,id:"l"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)});
    lsWrite(); render(); return;
  }
  try{ await (id? fillsCol.doc(id).set(body) : fillsCol.add(body)); }catch(e){ writeErr(e); throw e; }
}
async function deleteFill(id){
  if(backend!=="db"){ state.fills=state.fills.filter(x=>x.id!==id); lsWrite(); render(); return; }
  try{ await fillsCol.doc(id).delete(); }catch(e){ writeErr(e); }
}

/* ---------- Render ---------- */
const kpi=(l,v,u,h)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}${u?`<small>${u}</small>`:""}</div>${h?`<div class="h">${h}</div>`:""}</div>`;

function lastFullLabel(){ const ivs=intervals(); if(!ivs.length) return "–"; const d=ivs[ivs.length-1].to; return dmFmt.format(d); }
function heroHTML(){
  const ivs=intervals(), f=sortedAsc();
  if(!f.length) return `<div class="lbl">${t("hero.welcome")}</div><div style="margin-top:6px;font-size:15px">${t("hero.welcome1")}<br><span style="color:var(--text-2);font-size:13px">${t("hero.welcome2")}</span></div>`;
  if(!ivs.length) return `<div class="lbl">${t("hero.start")}</div><div style="margin-top:6px;font-size:15px">${t("hero.startText",{date:fmtDate(f[0].date)})}</div>`;
  const cur=ivs[ivs.length-1];
  const recent=share(ivs,new Date(today().getTime()-30*DAY),null);
  let html=`<div class="lbl">${t("hero.current",{date:fmtDate(toInput(cur.from))})}</div>

/* ---------- Prognose ----------
   Verbrauch je Kalendermonat aus allen bisherigen Daten (l/Tag); fehlt ein Monat, wird der
   aktuelle Verbrauch angenommen. Kosten mit dem zuletzt bezahlten Literpreis. */
function lastPaidPrice(h){ const p=sortedAsc(h).filter(f=>f.liters&&f.total); return p.length? p[p.length-1].total/p[p.length-1].liters : null; }
function forecast(){
  const ivs=intervals(); if(!ivs.length) return null;
  const h=H(), T=Calc.dayIdx(today()), m=WX_ON()? wxModel(h) : null;
  const dayRate=(d)=>{
    if(Calc.isPaused(h.pauses,d) && (pausedNow(h) || d<T)) return {rate:0,u:0};
    if(!m) return null;
    const u=wxUse(h,d); if(u==null) return null;
    return {rate:u, u: d<=T+16 ? (m.prior?.3:.12) : (m.prior?.4:.25)};
  };
  return Calc.forecast(ivs,{yearStart:SM(), today:today(), price:lastPaidPrice(), dayRate});
}
const roundEur=(v)=>{ const r=v>=1000?50:v>=200?10:5; return eur0(Math.round(v/r)*r); };

/* ---------- Tankstand je Heizung (für Erinnerung & Widget) ---------- */
/* Tankinhalt Tag für Tag ab der letzten Vollbetankung: Wettermodell, sonst aktueller Verbrauch; Pausen = 0 */
function tankState(h){
  const ivs=intervals(h), f=sortedAsc(h), cap=num(h.tank);
  if(!ivs.length||!cap||!f.length||!f[f.length-1].full) return null;
  const rate=ivs[ivs.length-1].rate, fillD=Calc.dayIdx(parseD(f[f.length-1].date)), T=Calc.dayIdx(today());
  let viaWx=false;
  const sim=Calc.simulateTank(cap, fillD, (d)=>{
    if(Calc.isPaused(h.pauses,d)) return 0;
    const u=wxUse(h,d); if(u!=null){ viaWx=true; return u; }
    return rate;
  }, 500);
  const i=Math.min(Math.max(0,T-fillD), sim.left.length-1);
  const left=Math.max(0, T-fillD>=sim.left.length ? 0 : sim.left[i]);
  const emptyD=sim.emptyD!=null? sim.emptyD : T+500;
  return { left, pct:Math.max(0,Math.min(100,left/cap*100)), daysLeft:Math.max(0,emptyD-T), emptyD, viaWx, fillD,
    curve:{ t0:Calc.dateOf(fillD).getTime(), left:sim.left.slice(0,240).map(x=>+x.toFixed(2)), emptyAt:Math.round(Calc.dateOf(Math.floor(emptyD)).getTime()+(emptyD%1)*DAY) } };
}
function tankInfo(h){
  const ivs=intervals(h), f=sortedAsc(h); const cap=num(h.tank);
  const out={id:h.id,name:h.name||t("app.defaultName"),cap:cap||0,hasData:ivs.length>0};
  if(!ivs.length) return out;
  const cur=ivs[ivs.length-1]; out.rate=cur.rate; out.costDay=cur.costRate;
  const last=f[f.length-1];
  out.lastFull=!!last.full; out.fillTime=parseD(last.date).getTime(); out.lastId=last.id;
  const ts=tankState(h);
  if(ts){ out.emptyAt=ts.curve.emptyAt; out.curve=ts.curve; }
  return out;
}
function reminderItems(){
  const n=state.settings.notify; const items=[];
  for(const h of state.heaters){
    if(!h.notify) continue; const t=tankInfo(h); if(!t.emptyAt) continue;
    const wd=new Date(t.emptyAt - n.days*DAY);
    const warnAt=new Date(wd.getFullYear(),wd.getMonth(),wd.getDate(),n.hour).getTime();
    items.push({key:`${h.id}|${t.lastId}|${n.days}|${Math.round(t.emptyAt/DAY)}`, heater:t.name, warnAt, emptyAt:Math.round(t.emptyAt)});
  }
  return items;
}

/* ---------- Wetter & Standort ---------- */
const WX_ON=()=> !!(APP && APP.requestLocation && state.settings.weather.on);
const pausedNow=(h)=>{ const T=Calc.dayIdx(today()); return (h.pauses||[]).find(p=>p.to==null && p.from<=T) || null; };
function togglePause(){
  const h=H(), T=Calc.dayIdx(today()), p=pausedNow(h);
  if(p){ if(p.from>=T) h.pauses=h.pauses.filter(x=>x!==p); else p.to=T; toast(t("pause.resumed")); }
  else { h.pauses=[...(h.pauses||[]), {from:T,to:null}]; toast(t("pause.paused")); }
  lastNative=""; saveSettings();
}
function locFor(h,d){
  if(h.loc && h.loc.mode==="fixed") return isFinite(h.loc.lat)? h.loc : null;
  const L=state.locs; if(!L.length) return null;
  let best=null; for(const x of L){ if(x.d<=d) best=x; else break; }
  return best||L[0];
}
const wxRec=(h,d)=>{ const l=locFor(h,d); return l? Weather.dayRec(Weather.cellOf(l.lat,l.lon), d) : null; };
const wxMemo=new Map();
/* Gelerntes Modell (Liter = a·Tage + b·Heizgrade). Vor dem ersten gelernten Abschnitt: Startschätzung
   aus dem letzten Verbrauch und dem Wetter der letzten zwei Wochen am aktuellen Ort. */
function wxModel(h){
  if(wxMemo.has(h.id)) return wxMemo.get(h.id);
  let m=null;
  if(WX_ON()){
    const ivs=intervals(h);
    const fit=Calc.fitWeather(Calc.weatherSamples(ivs,{dayRec:d=>wxRec(h,d), pauses:h.pauses, since:h.wxSince}));
    if(fit) m={...fit, prior:false};
    else if(ivs.length){
      const T=Calc.dayIdx(today()); let H=0,n=0;
      for(let d=T-14; d<T; d++){ const r=wxRec(h,d); if(r){ H+=Calc.hddAt(r,Calc.DEFAULT_BASE); n++; } }
      const rate=ivs[ivs.length-1].rate;
      if(n>=5 && H/n>0.5) m={a:0,b:rate/(H/n),base:Calc.DEFAULT_BASE,n:0,prior:true};
    }
  }
  wxMemo.set(h.id,m); return m;
}
function wxUse(h,d){
  if(!WX_ON()) return null;
  const m=wxModel(h); if(!m) return null;
  return Calc.usageOf(m, wxRec(h,d), false);
}
let wxBusy=false, wxErr=false, locWait=false;
async function refreshWeather(force){
  if(!WX_ON()||wxBusy) return;
  wxBusy=true; renderWx();
  try{
    const T=Calc.dayIdx(today()), cur=new Map(), past=new Map();
    for(const h of state.heaters){
      const since=h.wxSince??T;
      const l=locFor(h,T); if(l) cur.set(Weather.cellOf(l.lat,l.lon), Math.min(cur.get(Weather.cellOf(l.lat,l.lon))??T, since));
      if(h.loc.mode!=="fixed") for(const x of state.locs) if(x.d>=since-1){ const k=Weather.cellOf(x.lat,x.lon); past.set(k, Math.min(past.get(k)??T, Math.max(since,x.d))); }
    }
    for(const [k,since] of cur){ await Weather.ensureRecent(k, Math.min(since, T-14), force); await Weather.ensureClimate(k); }
    for(const [k,since] of past) if(!cur.has(k)) await Weather.ensureRecent(k, since, false);
    wxErr=false;
  }catch(e){ wxErr=true; }
  wxBusy=false; wxMemo.clear(); lastNative=""; render();
}

function barChart(el,data,fmt,color){

  const top=nice(max), iw=W-pl-pr, ih=H-pt-pb, bw=iw/data.length, barW=Math.max(6,bw-6);
  const T=((top/4)%1 && !((top/5)%1))?5:4;

  for(let i=0;i<=T;i++){ const y=pt+ih-ih*i/T; g+=`<line class="gridl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="axis" x="${pl-6}" y="${y+4}" text-anchor="end">${fmt.axis(top*i/T)}</text>`; }
  let bars="";

    const h=top&&d.v? ih*d.v/top:0, x=pl+i*bw+(bw-barW)/2, y=pt+ih-h, r=Math.min(4,barW/2,h);

    bars+=`<rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${ih}" fill="transparent" data-i="${i}"/>`;
    bars+=`<text class="axis" x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${d.label}</text>`;

    const i=+rc.dataset.i;

      const k=svg.getBoundingClientRect().width/W, h=top&&d.v? ih*d.v/top:0;

    rc.addEventListener("mouseenter",show); rc.addEventListener("touchstart",show,{passive:true});

function lineChart(el,series,fmt){

$("bkShowImport").onclick=()=>{ $("bkInWrap").classList.toggle("hidden"); $("bkOutWrap").classList.add("hidden"); };
$("bkImport").onclick=async()=>{
  let d; try{ d=JSON.parse($("bkIn").value.trim()); }catch(e){ toast(t("bk.invalid")); return; }
  if(!d||!Array.isArray(d.fills)){ toast(t("bk.invalid")); return; }
  const map={}; let changed=false;
  if(Array.isArray(d.heaters)&&d.heaters.length){
    for(const bh of d.heaters){ if(!bh||!bh.id) continue;
      let t=state.heaters.find(h=>h.id===bh.id) || (bh.name && state.heaters.find(h=>h.name===bh.name));
      if(!t && state.heaters.length===1 && !H().name && !heaterFills().length){ t=H(); Object.assign(t,newHeater({...bh,id:t.id})); changed=true; }
      if(!t){ t=newHeater({...bh, id: state.heaters.some(h=>h.id===bh.id)? undefined : bh.id}); state.heaters.push(t); changed=true; }
      map[bh.id]=t.id; }
  } else if(d.settings && typeof d.settings==="object" && !H().name && !num(H().tank)){
    const ds=d.settings; Object.assign(H(),{name:String(ds.name||"").slice(0,60), model:String(ds.model||"").slice(0,80), fuel:FUEL_NAMES.includes(ds.fuel)?ds.fuel:"Diesel", tank:num(ds.tank)}); changed=true;
  }
  const key=f=>`${hid(f)}|${String(f.date).slice(0,10)}|${(+f.liters).toFixed(2)}|${(+f.total||0).toFixed(2)}`;
  const have=new Set(state.fills.map(key)); let n=0;
  if(changed) saveSettings();
  for(const f of d.fills){
    if(!f||!f.date||!(+f.liters)) continue;
    const c={heaterId: map[f.heaterId]||state.active, date:String(f.date).slice(0,10), fuel: FUEL_NAMES.includes(f.fuel)? f.fuel : fuelOf({}), liters:+f.liters, total:+f.total||0, full:f.full!==false, note:String(f.note||"").slice(0,200), created:+f.created||Date.now()};
    if(have.has(key(c))) continue; have.add(key(c));
    try{ await saveFill(c); n++; }catch(e){ break; }
  }
  $("bkIn").value=""; $("bkInWrap").classList.add("hidden");
  toast(n? t("bk.imported",{n:tn("fillups",n,n_(n))}) : t("bk.nothing"));
};
window.__handleBack=()=>{
  if($("ov").classList.contains("on")){ closeForm(); return true; }
  if($("hov").classList.contains("on")){ $("hov").classList.remove("on"); return true; }
  if(state.view!=="home"){ go("home"); return true; }
  return false;
};

/* ---------- Navigation ---------- */
const VIEWS=["home","list","stats","settings"];
function go(v){
  if(!VIEWS.includes(v)) v="home"; state.view=v;
  VIEWS.forEach(x=>$("v-"+x).classList.toggle("hidden",x!==v));
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  $("fab").classList.toggle("hidden",v==="settings");
  if(location.hash.slice(1)!==v && !(v==="home"&&!location.hash)) history.replaceState(null,"","#"+v);
  render(); window.scrollTo(0,0);
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>go(b.dataset.v));
window.addEventListener("hashchange",()=>go(location.hash.slice(1)));
document.querySelectorAll("#period button").forEach(b=>b.onclick=()=>{ state.period=b.dataset.p; document.querySelectorAll("#period button").forEach(x=>x.classList.toggle("on",x===b)); render(); });
$("seasonSel").addEventListener("change",()=>{ state.seasonY=+$("seasonSel").value; render(); });
$("langPills").addEventListener("click",ev=>{ const b=ev.target.closest(".pill"); if(!b) return; state.settings.lang=b.dataset.l; applyLang(); saveSettings(); lastNative=""; render(); toast(t("toast.lang")); });
if(darkMQ&&darkMQ.addEventListener) darkMQ.addEventListener("change",()=>render());
document.addEventListener("click",ev=>{ const row=ev.target.closest(".entry"); if(!row) return; const f=state.fills.find(x=>x.id===row.dataset.id); if(f) openForm(f); });

$("sSave").onclick=()=>{
  Object.assign(H(),{name:$("sName").value.trim().slice(0,60), model:$("sModel").value.trim().slice(0,80), fuel:$("sFuel").value, tank:num($("sTank").value)});
  document.activeElement && document.activeElement.blur(); saveSettings(); toast(t("toast.saved"));
};
$("sYearStart").addEventListener("change",()=>{ state.settings.yearStart=+$("sYearStart").value; state.seasonY=null; saveSettings(); toast(t("hj.toast",{span:hjSpan()})); });
$("wSel").addEventListener("change",()=>{ state.settings.widget=$("wSel").value||null; saveSettings(); });

/* Heizungen wechseln / hinzufügen / löschen */
function renderHeaterList(){
  $("hList").innerHTML=state.heaters.map(h=>{ const n=heaterFills(h).length;
    return `<div class="hrow${h.id===state.active?" on":""}" data-h="${esc(h.id)}"><div class="hi">🔥</div><div><div class="hn">${esc(h.name||t("noName"))}</div><div class="hs">${esc(h.model||fuelName(h.fuel)||"")}${h.model||h.fuel?" · ":""}${tn("fillups",n,n_(n))}</div></div>${h.id===state.active?'<span class="ck">✓</span>':""}</div>`; }).join("");
}
$("hsw").onclick=()=>{ renderHeaterList(); $("hov").classList.add("on"); };
$("hClose").onclick=()=>$("hov").classList.remove("on");
$("hov").addEventListener("click",ev=>{ if(ev.target===$("hov")) $("hov").classList.remove("on"); const r=ev.target.closest(".hrow"); if(r){ state.active=r.dataset.h; state.seasonY=null; saveSettings(); $("hov").classList.remove("on"); toast(H().name||t("toast.heaterSwitched")); } });
function addHeater(){
  const h=newHeater({name:t("heater.newName",{n:state.heaters.length+1}), fuel:H().fuel});
  state.heaters.push(h); state.active=h.id; state.seasonY=null; saveSettings();
  $("hov").classList.remove("on"); go("settings");
  setTimeout(()=>{ $("sName").focus(); $("sName").select(); },80); toast(t("toast.newHeater"));
}
$("hAdd").onclick=addHeater; $("hAdd2").onclick=addHeater;
$("hDel").onclick=async()=>{
  const b=$("hDel"); if(state.heaters.length<2) return;
  if(b.dataset.confirm!=="1"){ b.dataset.confirm="1"; b.textContent=t("heater.delConfirm",{n:tn("entries",heaterFills().length,n_(heaterFills().length))}); setTimeout(()=>{b.dataset.confirm="";b.textContent=t("btn.delete");},4000); return; }
  b.dataset.confirm=""; b.textContent=t("btn.delete");
  const h=H(); const ids=heaterFills(h).map(f=>f.id);
  state.heaters=state.heaters.filter(x=>x.id!==h.id); state.active=state.heaters[0].id;
  if(state.settings.widget===h.id) state.settings.widget=null;
  for(const id of ids){ await deleteFill(id); }
  saveSettings(); toast(t("toast.heaterDeleted"));
};

/* Wetter, Standort, Pause */
$("wxOn").addEventListener("change",()=>{
  const on=$("wxOn").checked; state.settings.weather.on=on;
  if(on){ const T=Calc.dayIdx(today()); state.heaters.forEach(h=>{ if(h.wxSince==null) h.wxSince=T; }); }
  saveSettings();
  if(on){ if(wantPhoneLoc() && locStatus()==="default"){ try{ APP.requestLocationPermission(); }catch(e){} } else updateLocation(); }
});
$("wxPermBtn").addEventListener("click",()=>{ const a=$("wxPermBtn").dataset.act; try{ if(a==="ask") APP.requestLocationPermission(); else if(a==="loc") APP.openLocationSettings(); else APP.openAppSettings(); }catch(e){} });
$("pauseOpt").addEventListener("change",()=>{ state.settings.pauseFeature=$("pauseOpt").checked; saveSettings(); });
document.querySelectorAll("#locWrap .pill").forEach(b=>b.addEventListener("click",()=>{
  const h=H(); if(b.dataset.lm===h.loc.mode) return;
  h.loc = b.dataset.lm==="fixed" ? {mode:"fixed"} : {mode:"phone"};
  saveSettings();
  if(h.loc.mode==="phone"){ if(locStatus()==="default"){ try{ APP.requestLocationPermission(); }catch(e){} } else updateLocation(); }
  else setTimeout(()=>$("locQ").focus(),50);
}));
async function searchPlace(){
  const q=$("locQ").value.trim(); if(q.length<2) return;
  const box=$("locRes"); box.classList.remove("hidden"); box.innerHTML=`<button disabled>${t("wx.loading")}</button>`;
  try{
    const res=await Weather.geocode(q, I18N.getLang());
    box.innerHTML = res.length? res.map((r,i)=>`<button data-i="${i}">${esc(r.name)}<small>${esc(r.region)}</small></button>`).join("") : `<button disabled>${t("loc.noResult")}</button>`;
    box.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{ const r=res[+b.dataset.i]; H().loc={mode:"fixed",lat:r.lat,lon:r.lon,name:`${r.name}${r.region?", "+r.region.split(", ").pop():""}`}; box.classList.add("hidden"); $("locQ").value=""; saveSettings(); refreshWeather(true); toast(t("loc.set")); });
  }catch(e){ box.innerHTML=`<button disabled>${t("wx.error")}</button>`; }
}
$("locGo").addEventListener("click",searchPlace);
$("locQ").addEventListener("keydown",ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); searchPlace(); } });

/* Erinnerungen */
function setNotifyOn(v){ state.settings.notify.on=v; saveSettings(); if(v) toast(t("toast.notifyOn")); }
$("nOn").addEventListener("change",()=>{
  const want=$("nOn").checked;
  if(!want){ setNotifyOn(false); return; }
  const st=notifStatus();
  if(st==="granted"){ setNotifyOn(true); return; }
  $("nOn").checked=false;
  window.__onNotifPerm=(res)=>{ window.__onNotifPerm=null; if(res==="granted") setNotifyOn(true); else { state.settings.notify.on=true; saveSettings(); } };
  try{ APP.requestNotifications(); }catch(e){}
});
$("nDays").addEventListener("click",ev=>{ const b=ev.target.closest(".pill"); if(!b) return; state.settings.notify.days=+b.dataset.d; saveSettings(); });
$("nHour").addEventListener("click",ev=>{ const b=ev.target.closest(".pill"); if(!b) return; state.settings.notify.hour=+b.dataset.h; saveSettings(); });
$("nHeaters").addEventListener("change",ev=>{ const i=ev.target.closest("input[data-hn]"); if(!i) return; const h=state.heaters.find(x=>x.id===i.dataset.hn); if(h){ h.notify=i.checked; saveSettings(); } });
$("nOpenSys").onclick=()=>{ try{ APP.openNotificationSettings(); }catch(e){} };
$("nTest").onclick=()=>{ try{ const ti=tankInfo(H()); APP.testNotification(t("n.msgTitle",{name:ti.name}), t("n.testBody")); }catch(e){ toast(t("toast.appOnly")); } };
window.__onResume=()=>{ lastNative=""; render(); maybeCheckUpdate(false); updateLocation(); };

/* ---------- App-Updates (nur Android-App) ---------- */
const UPD_KEY="standheizung-upd";
const updStore=()=>{ try{ return JSON.parse(localStorage.getItem(UPD_KEY))||{}; }catch(e){ return {}; } };
const updSave=(o)=>{ try{ localStorage.setItem(UPD_KEY,JSON.stringify({...updStore(),...o})); }catch(e){} };
let upd=null, updProg=null, updManual=false;
function maybeCheckUpdate(manual){
  if(!APP||!APP.checkUpdate) return;
  const last=updStore().last||0;
  if(!manual && Date.now()-last < 6*3600*1000 && upd) return;
  updManual=manual; $("verStatus").textContent=t("upd.searching");
  try{ APP.checkUpdate(); }catch(e){}
}
window.__onUpdate=(res)=>{
  upd=res; updSave({last:Date.now()});
  if(updManual && res && res.ok && !res.available) toast(t("upd.latestToast"));
  if(updManual && res && !res.ok) toast(t("upd.noConn"));
  updManual=false; renderUpdate();
};
window.__onUpdateProgress=(p)=>{
  updProg=p;
  if(p===-1){ toast(t("upd.dlFail")); updProg=null; }
  if(p===-2){ updProg=null; }
  renderUpdate();
};
function renderUpdate(){
  if(!n0) return;
  const isApp=!!(APP&&APP.checkUpdate); $("verCard").classList.toggle("hidden",!isApp);
  if(!isApp) return;
  let cur="?"; try{ cur=APP.appVersion(); }catch(e){}
  $("verName").textContent=t("upd.version",{v:cur});
  const b=$("updBanner");
  if(upd && upd.ok && upd.available){
    $("verStatus").textContent=t("upd.newAvail",{v:upd.name});
    const dismissed = updStore().skip===upd.code && updProg==null;
    const note=(upd.notes||"").split("\n").map(x=>x.trim()).filter(Boolean)[0]||t("upd.defaultNote");
    let right, sub=esc(note);
    if(updProg!=null && updProg>=0 && updProg<100){ right=""; sub=`${t("upd.loading",{p:updProg})}<div class="pb"><i style="width:${updProg}%"></i></div>`; }
    else if(updProg===100){ right=""; sub=t("upd.opening"); }
    else right=`<button class="later" id="updLater">${t("upd.later")}</button><button class="go" id="updGo">${t("upd.install")}</button>`;
    b.innerHTML=`<div class="ui">⬆️</div><div style="min-width:0;flex:1"><div class="ut">${t("upd.banner",{v:esc(upd.name)})}</div><div class="us">${sub}</div></div><div class="ub">${right}</div>`;
    b.classList.toggle("hidden", dismissed);
    const go=$("updGo"), later=$("updLater");
    if(go) go.onclick=()=>{ updProg=0; renderUpdate(); try{ APP.installUpdate(upd.url); }catch(e){ updProg=null; renderUpdate(); } };
    if(later) later.onclick=()=>{ updSave({skip:upd.code}); b.classList.add("hidden"); toast(t("upd.laterToast")); };
  } else {
    b.classList.add("hidden");
    $("verStatus").textContent = !upd ? "–" : upd.ok ? t("upd.isLatest") : t("upd.unavailable");
  }
}
$("verCheck").onclick=()=>{ updSave({skip:null}); maybeCheckUpdate(true); };

/* ---------- Formular ---------- */
let editing=null;
const recalcTot=()=>{ const l=num($("fLit").value),p=num($("fPrice").value); if(l!=null&&p!=null) $("fTot").value=(l*p).toFixed(2); };
$("fLit").addEventListener("input",recalcTot); $("fPrice").addEventListener("input",recalcTot);
$("fTot").addEventListener("input",()=>{ const l=num($("fLit").value),t=num($("fTot").value); if(l&&t!=null) $("fPrice").value=(t/l).toFixed(3); });
const lastPriceFor=(name)=>{ const s=sortedAsc().filter(x=>x.liters&&x.total&&fuelOf(x)===name); return s.length? (s[s.length-1].total/s[s.length-1].liters).toFixed(3) : ""; };
$("fFuel").addEventListener("change",()=>{ if(editing) return; const p=lastPriceFor($("fFuel").value); $("fPrice").value=p; recalcTot(); });
function openForm(f={}){
  editing=f.id?f:null;
  $("fTitle").textContent=editing?t("f.edit"):t("f.new");
  $("fDate").value=f.date||toInput(new Date());
  $("fLit").value=f.liters??"";
  const lastP=(()=>{const s=sortedAsc().filter(x=>x.liters&&x.total);return s.length? (s[s.length-1].total/s[s.length-1].liters).toFixed(3):"";})();
  $("fPrice").value=f.liters&&f.total? (f.total/f.liters).toFixed(3) : lastP;
  $("fTot").value=f.total??"";
  $("fFull").checked=f.full??true;
  const lastFill=sortedAsc().slice(-1)[0];
  $("fFuel").value = f.id ? fuelOf(f) : (lastFill? fuelOf(lastFill) : (FUEL_NAMES.includes(H().fuel)?H().fuel:"Diesel"));
  if(!f.id){ const lp=lastPriceFor($("fFuel").value); if(lp) $("fPrice").value=lp; }
  $("fNote").value=f.note||"";
  $("fDel").classList.toggle("hidden",!editing);
  $("ov").classList.add("on");
  if(!editing) setTimeout(()=>$("fLit").focus(),50);
}
function closeForm(){ $("ov").classList.remove("on"); editing=null; }
$("fab").onclick=()=>openForm();
$("fCancel").onclick=closeForm;
$("ov").addEventListener("click",ev=>{ if(ev.target===$("ov")) closeForm(); });
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape") closeForm(); });
$("fDel").onclick=async()=>{
  const b=$("fDel");
  if(b.dataset.confirm!=="1"){ b.dataset.confirm="1"; b.textContent=t("btn.sure"); setTimeout(()=>{b.dataset.confirm="";b.textContent=t("btn.delete");},3000); return; }
  b.dataset.confirm=""; b.textContent=t("btn.delete"); const id=editing.id; closeForm(); await deleteFill(id); toast(t("toast.deleted"));
};
$("form").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const liters=num($("fLit").value); if(!liters){ toast(t("toast.enterAmount")); return; }
  const price=num($("fPrice").value), total=num($("fTot").value) ?? (price!=null? +(liters*price).toFixed(2) : 0);
  const f={date:$("fDate").value, fuel:$("fFuel").value, liters, total, full:$("fFull").checked, note:$("fNote").value.trim(), created: editing?.created ?? Date.now()};
  f.heaterId = editing ? hid(editing) : state.active;
  if(editing) f.id=editing.id;
  closeForm();
  try{ await saveFill(f); toast(t("toast.saved")); updateLocation(); }catch(e){}
});

applyLang();
go(location.hash.slice(1)||"home");
init();
renderUpdate(); setTimeout(()=>maybeCheckUpdate(false),800); setTimeout(updateLocation,1200);
})();
</script>
